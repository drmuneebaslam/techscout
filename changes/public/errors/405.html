<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>405 Method Not Allowed — TechScout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #05070c;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(ellipse at top, rgba(168,85,247,0.15) 0%, transparent 60%),
        radial-gradient(circle at bottom right, rgba(56,189,248,0.08) 0%, transparent 50%);
    }
    .error-card {
      max-width: 600px;
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(168, 85, 247, 0.12);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
      margin-bottom: 1.25rem;
    }
    .error-code {
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #a855f7 0%, #c084fc 50%, #e879f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.04);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .meta-box {
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      padding-top: 1.25rem;
      font-family: monospace;
      font-size: 0.76rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="badge">⚙️ HTTP Protocol Verb Mismatch</div>
    <div class="error-code">405</div>
    <h1>HTTP Method Not Allowed</h1>
    <p>The HTTP verb used to request this route is not supported. For example, submitting POST data to a GET endpoint, or sending an unauthorized method.</p>
    
    <div class="action-group">
      <a href="/" class="btn btn-primary">Return to Homepage</a>
      <a href="/api-docs" class="btn btn-outline">API Documentation</a>
    </div>

    <div class="meta-box">
      <span id="target-path">Route: /</span>
      <span id="timestamp">Timestamp: --</span>
    </div>
  </div>

  <script>
    document.getElementById('target-path').textContent = 'Route: ' + window.location.pathname;
    document.getElementById('timestamp').textContent = 'UTC: ' + new Date().toISOString().replace('T', ' ').substring(0, 19);
  </script>
</body>
</html>
